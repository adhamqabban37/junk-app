name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: junkyard
          POSTGRES_PASSWORD: junkyard_dev
          POSTGRES_DB: junkyard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junkyard -d junkyard_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Deliberately the non-superuser junkyard_app role, not the postgres
      # service's own superuser -- Postgres never applies row-level security
      # to a superuser connection (see docker/postgres-init/01-app-role.sql
      # and PROGRESS.md's Phase 1 "Resolved blockers" for why this matters).
      DATABASE_URL: postgres://junkyard_app:junkyard_app_dev@localhost:5432/junkyard_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      GEMINI_API_KEY: ci-placeholder-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - run: npm ci

      - name: Apply Postgres init scripts (pgvector extension + non-superuser app role)
        run: |
          PGPASSWORD=junkyard_dev psql -h localhost -U junkyard -d junkyard_dev -f docker/postgres-init/00-extensions.sql
          PGPASSWORD=junkyard_dev psql -h localhost -U junkyard -d junkyard_dev -f docker/postgres-init/01-app-role.sql

      - run: npm run migrate --workspace=backend

      - run: npm run lint --workspace=backend

      - run: npm run test:backend

      # TODO(backend e2e flake): still informational only, does not block the
      # pipeline -- not weakened, just not gating. Status as of 2026-08-08,
      # after measuring this properly for the first time (30 local runs):
      #
      # There are TWO independent failure modes here, which is why this
      # looked unfixable for so long -- fixing either one alone still leaves
      # the suite red a third of the time.
      #
      #  1. FIXED. The "Unhandled error: Connection is closed" teardown race,
      #     root-caused and fixed in test/close-test-app.ts -- see
      #     settleBullMqConnections()'s comment. It was never the cross-file
      #     race it was diagnosed as: app.e2e-spec.ts reproduced it running
      #     completely alone, 2 runs in 3. Measured: 4 occurrences in 9 runs
      #     before the fix, 0 in 14 runs after.
      #
      #  2. NOT FIXED, and newly identified -- this is what still keeps the
      #     step non-gating. A *native* crash that kills the Jest process
      #     outright: Windows exit code -1073740791 (0xC0000409,
      #     STATUS_STACK_BUFFER_OVERRUN), no test output, no JS stack. It is
      #     NOT caused by the fix above -- it reproduces at a similar rate on
      #     the original close-test-app.ts (2 in 9 runs original, 4 in 14
      #     runs fixed; same order of magnitude either way). It has simply
      #     never been written down before, because mode 1 was noisy enough
      #     to hide it. NB: 0xC0000409 is a Windows status code -- whether
      #     this same mode is what fails on GitHub's Linux runners (reported
      #     there as an ECONNRESET on auth.e2e-spec.ts's pooled-connection
      #     concurrent test) is UNKNOWN and unverified.
      #
      # So: do not re-gate this step on the strength of mode 1 being fixed.
      # Next lever is mode 2 -- a native-layer crash during repeated
      # app teardown, so suspect the native side (node-postgres/libpq socket
      # teardown, or Node itself on Windows) rather than more JS-level
      # BullMQ patching, and reproduce it on Linux before assuming CI shares
      # the cause.
      - name: Run backend e2e (informational -- see TODO above)
        continue-on-error: true
        run: npm run test:e2e --workspace=backend

      - run: npm run build:backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - run: npm ci

      - run: npm run lint --workspace=frontend

      - run: npm run test:frontend

      - run: npm run build:frontend

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e (requires a production build, see playwright.config.ts)
        run: npm run test:e2e --workspace=frontend
